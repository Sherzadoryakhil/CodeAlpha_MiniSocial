<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="t d">
  <title id="t">A growing circle of friends</title>
  <desc id="d">A ring of friendly avatars connected by lines around a central chat bubble with a heart.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCF8C6"/><stop offset="1" stop-color="#25D366"/></linearGradient>
  </defs>
  <circle cx="260" cy="200" r="170" fill="#ffffff" fill-opacity=".07"/>
  <circle cx="260" cy="200" r="120" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 8"/>
